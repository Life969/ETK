# ==================== СЕРВЕР ====================
server.port=8080
server.address=0.0.0.0

# ==================== THYMELEAF ====================
# Отключаем кэш шаблонов — изменения в HTML видны без перезапуска
# В продакшене лучше поставить true для скорости
spring.thymeleaf.cache=false

# ==================== БАЗА ДАННЫХ ====================
spring.datasource.url=jdbc:postgresql://postgres:5432/jobdb
spring.datasource.username=jobuser
spring.datasource.password=zpletk
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / HIBERNATE ====================
# none — схему создаём и меняем только через Liquibase
# (никогда не используем update/create в продакшене)
spring.jpa.hibernate.ddl-auto=none
# Логирование SQL-запросов (для отладки, в продакшене выключить)
spring.jpa.show-sql=true
# Отключаем предупреждение про open-in-view
spring.jpa.open-in-view=false

# ==================== LIQUIBASE ====================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
logging.level.liquibase=INFO

# ==================== ЗАГРУЗКА ФАЙЛОВ ====================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==================== KAFKA ====================
# true  — отправлять события в Kafka (когда поднят брокер и сервис производства)
# false — заглушка, события не отправляются, KafkaProducerService может не подниматься
kafka.enabled=false

# ==================== ACTUATOR (для Docker HEALTHCHECK) ====================
# Показывать детали health (нужно, чтобы контейнер видел статус UP)
management.endpoint.health.show-details=always
# Какие эндпоинты открывать по HTTP
management.endpoints.web.exposure.include=health,info
# Роли для доступа к health (пусто = доступ без роли, но всё равно аутентификация)
management.endpoint.health.roles=

# ==================== ЛОГИРОВАНИЕ ====================
# Корневой уровень — INFO, чтобы не засорять логи отладкой
logging.level.root=INFO
# Уровень для твоего пакета (можно DEBUG при отладке)
logging.level.ProjectForJob=INFO