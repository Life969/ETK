<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Заполярье — Панель</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <script src="https://unpkg.com/@hotwired/turbo@8.0.12/dist/turbo.es2017-umd.js"></script>
</head>
<body class="factory-page">

<div th:replace="~{fragments/scene :: scene}"></div>

<main class="app-panel">
    <div class="app-glass">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Внутри — только контент, БЕЗ вложенных turbo-frame с тем же id -->
        <turbo-frame id="app" class="app-frame">
            <div th:replace="~{__${contentTemplate}__}"></div>
        </turbo-frame>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/tooltip.js(v=6)}"></script>
<script th:src="@{/js/bear-scene.js(v=6)}"></script>

<script>
    // ============================================================
    // Инициализация тултипов (после Turbo-навигаций тоже)
    // ============================================================
    function initWow() {
        if (window.WowTooltip) WowTooltip.init('.product-tooltip');
    }
    document.addEventListener('DOMContentLoaded', initWow);
    document.addEventListener('turbo:load', initWow);
    document.addEventListener('turbo:frame-load', (e) => {
        if (e.target.id === 'app') initWow();
    });
    if (document.readyState !== 'loading') initWow();

    // ============================================================
    // Делегирование обработки файла (base64 → hidden) для форм
    // ============================================================
    document.addEventListener('change', (e) => {
        if (e.target && e.target.id === 'imageFileInput') {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert('Файл слишком большой. Максимальный размер 5 МБ.');
                e.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function (ev) {
                const hidden = document.getElementById('imageBase64');
                if (hidden) hidden.value = ev.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // ============================================================
    // Плавность и защита от двойных кликов
    // ============================================================
    document.addEventListener('turbo:before-frame-render', (e) => {
        if (e.target && e.target.id === 'app') {
            e.target.style.opacity = '0.4';
        }
    });
    document.addEventListener('turbo:frame-render', (e) => {
        if (e.target && e.target.id === 'app') {
            e.target.style.opacity = '1';
        }
    });

    // ============================================================
    // Аккордеон справочников (делегирование, работает после Turbo)
    // ============================================================
    document.addEventListener('click', (e) => {
        const toggle = e.target.closest('.hb-accordion-toggle');
        if (!toggle) return;

        const targetId = toggle.dataset.target;
        const body = document.getElementById(targetId);
        if (!body) return;

        toggle.classList.toggle('open');
        body.classList.toggle('open');
    });
</script>

</body>
</html>
