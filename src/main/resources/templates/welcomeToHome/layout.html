<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''">
    <meta name="turbo-cache-control" content="no-preview">
    <title>Заполярье — Панель</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css(v=2)}">



    <script src="https://unpkg.com/@hotwired/turbo@8.0.12/dist/turbo.es2017-umd.js"></script>
</head>
<body class="factory-page">

<div th:replace="~{fragments/scene :: scene}"></div>

<main class="app-panel">
    <div class="app-glass">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Внутри — только контент, БЕЗ вложенных turbo-frame с тем же id -->
        <turbo-frame id="app" class="app-frame" data-turbo-action="advance">
            <div th:replace="~{__${contentTemplate}__}"></div>
        </turbo-frame>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/tooltip.js(v=7)}"></script>
<script th:src="@{/js/bear-scene.js(v=6)}"></script>
<script th:src="@{/js/orders-form.js(v=4)}"></script>
<script th:src="@{/js/journal-form.js?v=2}"></script>
<script th:src="@{/js/nav-beam.js(v=3)}"></script>
<script th:src="@{/js/app.js(v=3)}"></script>

</body>
</html>
