<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>ЕТК</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="factory-page">

<div th:replace="~{fragments/scene :: scene}"></div>

<main class="welcome-panel">
    <div class="panel-glass">
        <div class="panel-header">
            <h1 class="panel-title">Екатеринбургская Трубная Компания</h1>
            <p class="panel-subtitle">Система управления производством</p>
        </div>

        <div class="panel-body" id="panelBody">

            <!-- Состояние 1: кнопка "Войти" -->
            <div class="panel-state auth-start"
                 th:classappend="${#strings.isEmpty(param.error)} ? 'active'"
                 id="authStart">
                <button class="btn-enter" type="button" id="btnEnter"
                        th:attr="data-auth=${#authentication != null
                            and #authentication.name != 'anonymousUser'}">
                    <span>Войти</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>

            <!-- Состояние 2: форма логина -->
            <div class="panel-state auth-form"
                 th:classappend="${!#strings.isEmpty(param.error)} ? 'active'"
                 id="authForm">

                <div class="auth-error" th:if="${!#strings.isEmpty(param.error)}">
                    <span class="auth-error-icon">!</span>
                    <span>Неверный логин или пароль</span>
                </div>

                <form method="post" th:action="@{/login}" data-turbo="false">
                    <div class="form-field">
                        <label for="username">Логин</label>
                        <input type="text" id="username" name="username"
                               autocomplete="username" required>
                    </div>
                    <div class="form-field">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>

                    <button class="btn-enter" type="submit">
                        <span>Авторизироваться</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>

                    <button class="btn-back" type="button" id="btnBack">← Назад</button>
                </form>
            </div>

        </div>

        <div class="panel-footer">
            <span>© 2026 Екатеринбургская трубная компания</span>
            <span class="version">v 0.2</span>
        </div>

        <div class="panel-leaves" aria-hidden="true">
            <svg class="p-leaf p-leaf-1" viewBox="0 0 40 60"><use href="#leaf-icon"/></svg>
            <svg class="p-leaf p-leaf-2" viewBox="0 0 40 60"><use href="#leaf-icon"/></svg>
            <svg class="p-leaf p-leaf-3" viewBox="0 0 40 60"><use href="#leaf-icon"/></svg>
            <svg class="p-leaf p-leaf-4" viewBox="0 0 40 60"><use href="#leaf-icon"/></svg>
            <svg class="p-leaf p-leaf-5" viewBox="0 0 40 60"><use href="#leaf-icon"/></svg>
            <svg class="p-leaf p-leaf-6" viewBox="0 0 40 60"><use href="#leaf-icon"/></svg>
        </div>
    </div>
</main>

<script th:src="@{/js/bear-scene.js}"></script>
</body>
</html>
