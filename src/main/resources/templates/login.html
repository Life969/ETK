<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h1>Вход</h1>
<form th:action="@{/login}" method="post">
    <div>
        <label>Логин: <input type="text" name="username"/></label>
    </div>
    <div>
        <label>Пароль: <input type="password" name="password"/></label>
    </div>
    <div>
        <input type="submit" value="Войти"/>
    </div>
</form>
</body>
</html>
