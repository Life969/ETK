<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="handbook-content">

    <header class="handbook-header">
        <div class="handbook-title-wrap">
            <h1 class="handbook-title">Группы прочности стали</h1>
            <span class="handbook-count"
                  th:text="${groups != null ? #lists.size(groups) : 0} + ' шт.'">0 шт.</span>
        </div>
        <a th:href="@{/steel-groups/new}" data-turbo-frame="app" class="btn-glass btn-glass-primary">
            <i class="bi bi-plus-lg"></i> Добавить группу
        </a>
    </header>

    <div th:if="${message}" th:class="'handbook-alert handbook-alert-' + ${messageType}">
        <i class="bi bi-info-circle"></i>
        <span th:text="${message}">—</span>
    </div>

    <div th:if="${groups == null or groups.isEmpty()}" class="journal-empty">
        Справочник групп прочности пуст
    </div>

    <div class="hb-accordion" th:unless="${groups == null or groups.isEmpty()}">
        <div th:each="group, iter : ${groups}" class="hb-accordion-item">

            <button type="button" class="hb-accordion-toggle"
                    th:classappend="${iter.index == 0} ? 'open' : ''"
                    th:attr="data-target='hb-steel-body-' + ${iter.index}">
                <i class="bi bi-chevron-right hb-chev"></i>
                <span class="hb-accordion-name">
                    <strong th:text="${group.code}">Д</strong>
                    <span th:text="' — ' + ${group.name}">—</span>
                </span>
                <span class="hb-accordion-count">
                    <span th:text="${group.markupPercent} + '%'">0%</span>
                    <span th:if="${group.isDefault}" class="badge bg-info ms-2">по умолчанию</span>
                    <span th:unless="${group.active}" class="badge bg-secondary ms-2">скрыта</span>
                </span>
            </button>

            <div class="hb-accordion-body" th:classappend="${iter.index == 0} ? 'open' : ''"
                 th:id="'hb-steel-body-' + ${iter.index}">

                <div style="padding:8px 14px 4px; display:flex; gap:8px; align-items:center;">
                    <a th:href="@{/steel-groups/edit/{id}(id=${group.id})}"
                       data-turbo-frame="app" class="hb-icon-btn" title="Редактировать группу">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{/steel-groups/delete/{id}(id=${group.id})}"
                          method="post" style="display:inline"
                          onsubmit="return confirm('Удалить группу? Должны отсутствовать марки.');">
                        <button type="submit" class="hb-icon-btn" title="Удалить группу">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                    <a th:href="@{/steel-groups/{gid}/grades/new(gid=${group.id})}"
                       data-turbo-frame="app"
                       class="btn-glass btn-glass-primary"
                       style="margin-left:auto;">
                        <i class="bi bi-plus-lg"></i> Добавить марку
                    </a>
                </div>

                <div th:if="${group.grades == null or group.grades.isEmpty()}"
                     class="journal-empty" style="padding:14px; opacity:0.6;">
                    Марки не заведены
                </div>

                <table th:unless="${group.grades == null or group.grades.isEmpty()}"
                       class="journal-table hb-table">
                    <thead>
                    <tr>
                        <th style="width:80px;">ID</th>
                        <th>Марка</th>
                        <th>Описание</th>
                        <th style="width:100px;">Активна</th>
                        <th style="width:120px;"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="grade : ${group.grades}">
                        <td th:text="${grade.id}">1</td>
                        <td><strong th:text="${grade.name}">40Х</strong></td>
                        <td th:text="${grade.description}">—</td>
                        <td>
                            <span th:if="${grade.active}" class="badge bg-success">да</span>
                            <span th:unless="${grade.active}" class="badge bg-secondary">нет</span>
                        </td>
                        <td class="hb-actions">
                            <a th:href="@{/steel-groups/grades/edit/{id}(id=${grade.id})}"
                               data-turbo-frame="app" class="hb-icon-btn" title="Редактировать">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/steel-groups/grades/delete/{id}(id=${grade.id})}"
                                  method="post" style="display:inline"
                                  onsubmit="return confirm('Удалить марку?');">
                                <button type="submit" class="hb-icon-btn" title="Удалить">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
