<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="handbook-content">

    <header class="handbook-header">
        <div class="handbook-title-wrap">
            <a th:href="@{/steel-groups}" data-turbo-frame="app"
               class="hb-icon-btn hb-back" title="Назад">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h1 class="handbook-title"
                th:text="${grade.id == null}
                    ? 'Новая марка стали (группа ' + ${group.code} + ')'
                    : 'Редактирование марки'">
                Марка стали
            </h1>
        </div>
    </header>

    <form th:action="${grade.id == null}
                        ? @{/steel-groups/{gid}/grades/save(gid=${group.id})}
                        : @{/steel-groups/{gid}/grades/save(gid=${group.id})}"
          th:object="${grade}" method="post"
          class="handbook-form">

        <input type="hidden" th:field="*{id}"/>

        <div class="hb-grid">

            <div class="hb-field hb-field-full">
                <label>Группа прочности</label>
                <input type="text" th:value="${group.code} + ' — ' + ${group.name}"
                       disabled/>
            </div>

            <div class="hb-field hb-field-full">
                <label for="name">Марка стали <span class="req">*</span></label>
                <input type="text" id="name" th:field="*{name}" required maxlength="100"
                       placeholder="Например, 40Х / 30ХГСА"/>
                <span class="hb-error" th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}"></span>
            </div>

            <div class="hb-field hb-field-full">
                <label for="description">Описание</label>
                <textarea id="description" th:field="*{description}" rows="3"
                          placeholder="Необязательно"></textarea>
            </div>

            <div class="hb-field hb-field-full">
                <label class="hb-check">
                    <input type="checkbox" th:field="*{active}"/>
                    <div class="hb-check-body">
                        <span class="hb-check-label">Активна</span>
                        <span class="hb-check-desc">
              Неактивные марки не показываются в форме заказа при выборе группы прочности.
            </span>
                    </div>
                </label>
            </div>

        </div>

        <div class="handbook-form-actions">
            <button type="submit" class="btn-glass btn-glass-primary">
                <i class="bi bi-check-lg"></i> Сохранить
            </button>
            <a th:href="@{/steel-groups}" data-turbo-frame="app"
               class="btn-glass btn-glass-ghost">
                Отмена
            </a>
        </div>

    </form>

</div>

</body>
</html>
