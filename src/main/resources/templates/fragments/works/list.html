<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="handbook-content">

    <header class="handbook-header">
        <div class="handbook-title-wrap">
            <h1 class="handbook-title">Дополнительные работы</h1>
            <span class="handbook-count"
                  th:text="${works != null ? #lists.size(works) : 0} + ' шт.'">0 шт.</span>
        </div>
        <a th:href="@{/additionalWork/new}" data-turbo-frame="app" class="btn-glass btn-glass-primary">
            <i class="bi bi-plus-lg"></i> Добавить работу
        </a>
    </header>

    <div th:if="${message}" th:class="'handbook-alert handbook-alert-' + ${messageType}">
        <i class="bi bi-info-circle"></i>
        <span th:text="${message}">—</span>
    </div>

    <div th:if="${works == null or works.isEmpty()}" class="journal-empty">
        Список дополнительных работ пуст
    </div>

    <table th:unless="${works == null or works.isEmpty()}" class="journal-table">
        <thead>
        <tr>
            <th style="width: 80px;">ID</th>
            <th>Наименование</th>
            <th style="width: 140px;">Цена (₽)</th>
            <th>Комментарий</th>
            <th style="width: 120px;"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="work : ${works}">
            <td th:text="${work.id}">1</td>
            <td th:text="${work.name}">—</td>
            <td th:text="${work.price}">—</td>
            <td th:text="${work.description}">—</td>
            <td class="hb-actions">
                <a th:href="@{/additionalWork/edit/{id}(id=${work.id})}"
                   data-turbo-frame="app" class="hb-icon-btn" title="Редактировать">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{/additionalWork/delete/{id}(id=${work.id})}" method="post"
                      onsubmit="return confirm('Удалить работу?');" style="display:inline">
                    <button type="submit" class="hb-icon-btn" title="Удалить">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
