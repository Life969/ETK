<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="handbook-content">

    <header class="handbook-header">
        <div class="handbook-title-wrap">
            <a th:href="@{/additionalWork}" data-turbo-frame="app" class="hb-icon-btn hb-back" title="Назад">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h1 class="handbook-title"
                th:text="${work.id == null} ? 'Новая дополнительная работа' : 'Редактирование работы'">
                Новая дополнительная работа
            </h1>
        </div>
    </header>

    <form th:action="@{/additionalWork/save}" th:object="${work}" method="post"
          class="handbook-form">

        <input type="hidden" th:field="*{id}"/>

        <div class="hb-grid">

            <div class="hb-field hb-field-full">
                <label for="name">Наименование работы <span class="req">*</span></label>
                <input type="text" id="name" th:field="*{name}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="hb-field">
                <label for="price">Стоимость (₽) <span class="req">*</span></label>
                <input type="number" step="0.01" min="0.01" id="price" th:field="*{price}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
            </div>

            <div class="hb-field hb-field-full">
                <label for="description">Описание</label>
                <textarea id="description" th:field="*{description}" rows="3"
                          placeholder="Необязательно"></textarea>
            </div>

        </div>

        <div class="handbook-form-actions">
            <button type="submit" class="btn-glass btn-glass-primary">
                <i class="bi bi-check-lg"></i> Сохранить
            </button>
            <a th:href="@{/additionalWork}" data-turbo-frame="app" class="btn-glass btn-glass-ghost">
                Отмена
            </a>
        </div>

    </form>

</div>

</body>
</html>
