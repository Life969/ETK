<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="handbook-content">

  <header class="handbook-header">
    <div class="handbook-title-wrap">
      <a th:href="@{/external-threads}"
         data-turbo-frame="app"
         class="hb-icon-btn hb-back"
         title="Назад">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h1 class="handbook-title"
          th:text="${externalThread.id == null} ? 'Новая резьба' : 'Редактирование резьбы'">
        Новая резьба
      </h1>
    </div>
  </header>

  <form th:action="@{/external-threads/save}"
        th:object="${externalThread}"
        method="post"
        class="handbook-form">

    <input type="hidden" th:field="*{id}"/>

    <div class="hb-grid">

      <div class="hb-field">
        <label for="type">Тип резьбы (наружная) <span class="req">*</span></label>
        <input type="text" id="type" th:field="*{type}"
               placeholder="НКТ, ОТТМ, ОТТГ..."/>
        <span class="hb-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
      </div>

      <div class="hb-field">
        <label for="conditionalDiameter">Условный диаметр <span class="req">*</span></label>
        <input type="text" id="conditionalDiameter" th:field="*{conditionalDiameter}"
               placeholder="73, 89..."/>
        <span class="hb-error" th:if="${#fields.hasErrors('conditionalDiameter')}" th:errors="*{conditionalDiameter}"></span>
      </div>

      <div class="hb-field">
        <label for="manufacturingCost">
          Цена изготовления, ₽ <span class="req">*</span>
          <span style="text-transform:none;letter-spacing:0;opacity:.6;">
                        (за 1 нарезку)
                    </span>
        </label>
        <input type="number" step="0.01" id="manufacturingCost"
               th:field="*{manufacturingCost}"/>
        <span class="hb-error" th:if="${#fields.hasErrors('manufacturingCost')}" th:errors="*{manufacturingCost}"></span>
      </div>

      <div class="hb-field">
        <label for="priceForEmployee">
          Цена работнику, ₽ <span class="req">*</span>
          <span style="text-transform:none;letter-spacing:0;opacity:.6;">
                        (за 1 изделие, 2 резьбы)
                    </span>
        </label>
        <input type="number" step="0.01" id="priceForEmployee"
               th:field="*{priceForEmployee}"/>
        <span class="hb-error" th:if="${#fields.hasErrors('priceForEmployee')}" th:errors="*{priceForEmployee}"></span>
      </div>

      <div class="hb-field hb-field-full">
        <label for="standart">ГОСТ / стандарт</label>
        <input type="text" id="standart" th:field="*{standart}"
               placeholder="ГОСТ 633-80 / API 5CT"/>
        <span class="hb-error" th:if="${#fields.hasErrors('standart')}" th:errors="*{standart}"></span>
      </div>

      <div class="hb-field hb-field-full">
        <label for="description">Описание</label>
        <textarea id="description" th:field="*{description}"
                  rows="3" placeholder="Необязательно"></textarea>
      </div>

      <div class="hb-field hb-field-full">
        <label for="imageFileInput">Фото резьбы (jpg, png, gif, до 5 МБ)</label>
        <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/gif"/>
        <input type="hidden" id="imageBase64" name="imageBase64"/>

        <div th:if="${externalThread.imagePath != null and !externalThread.imagePath.isEmpty()}"
             class="hb-image-preview">
          <img th:src="@{${externalThread.imagePath}}" alt="Текущее фото"/>
          <p>Текущее фото. Загрузите новое, чтобы заменить.</p>
        </div>
      </div>

    </div>

    <div class="handbook-form-actions">
      <button type="submit" class="btn-glass btn-glass-primary">
        <i class="bi bi-check-lg"></i> Сохранить
      </button>
      <a th:href="@{/external-threads}"
         data-turbo-frame="app"
         class="btn-glass btn-glass-ghost">
        Отмена
      </a>
    </div>

  </form>

</div>

</body>
</html>
