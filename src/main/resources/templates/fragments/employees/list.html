<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="handbook-content">

    <header class="handbook-header">
        <div class="handbook-title-wrap">
            <h1 class="handbook-title">Сотрудники</h1>
            <span class="handbook-count"
                  th:text="${employees != null ? #lists.size(employees) : 0} + ' чел.'">0 чел.</span>
        </div>
        <a th:href="@{/employees/new}" data-turbo-frame="app" class="btn-glass btn-glass-primary">
            <i class="bi bi-plus-lg"></i> Добавить сотрудника
        </a>
    </header>

    <div th:if="${message}" th:class="'handbook-alert handbook-alert-' + ${messageType}">
        <i class="bi bi-info-circle"></i>
        <span th:text="${message}">—</span>
    </div>

    <div th:if="${employees == null or employees.isEmpty()}" class="journal-empty">
        Список сотрудников пуст
    </div>

    <table th:unless="${employees == null or employees.isEmpty()}" class="journal-table">
        <thead>
        <tr>
            <th style="width: 80px;">ID</th>
            <th>Имя сотрудника</th>
            <th style="width: 120px;"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}">1</td>
            <td th:text="${emp.name}">—</td>
            <td class="hb-actions">
                <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                   data-turbo-frame="app" class="hb-icon-btn" title="Редактировать">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{/employees/delete/{id}(id=${emp.id})}" method="post"
                      onsubmit="return confirm('Удалить сотрудника?');" style="display:inline">
                    <button type="submit" class="hb-icon-btn" title="Удалить">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
