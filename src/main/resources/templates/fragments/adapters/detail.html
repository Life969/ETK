<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="handbook-content">

    <header class="handbook-header">
        <div class="handbook-title-wrap">
            <a th:href="@{/pipe-adapters}" data-turbo-frame="app" class="hb-icon-btn hb-back">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h1 class="handbook-title"
                th:text="'Переводник ' + ${pipeAdapter.firstSideType} + ' ' + ${pipeAdapter.firstSideDiameter}
                        + ' x ' + ${pipeAdapter.secondSideType} + ' ' + ${pipeAdapter.secondSideDiameter}">
                Переводник
            </h1>
        </div>
        <div class="hb-actions-row">
            <button type="button"
                    class="btn-glass btn-glass-info"
                    id="drawingToggle"
                    th:if="${pipeAdapter.drawingPath != null and !pipeAdapter.drawingPath.isEmpty()}">
                <i class="bi bi-rulers"></i> Чертёж
            </button>

            <a th:href="@{/pipe-adapters/edit/{id}(id=${pipeAdapter.id})}"
               data-turbo-frame="app" class="btn-glass btn-glass-primary">
                <i class="bi bi-pencil"></i> Редактировать
            </a>
            <form th:action="@{/pipe-adapters/delete/{id}(id=${pipeAdapter.id})}" method="post"
                  onsubmit="return confirm('Удалить переводник?');" style="display:inline">
                <button type="submit" class="btn-glass btn-glass-danger">
                    <i class="bi bi-trash"></i> Удалить
                </button>
            </form>
        </div>
    </header>

    <!-- ─── Карточка с характеристиками ─── -->
    <div class="hb-detail">

        <div class="hb-detail-image"
             th:if="${pipeAdapter.imagePath != null and !pipeAdapter.imagePath.isEmpty()}">
            <img th:src="@{${pipeAdapter.imagePath}}" alt="Фото переводника"/>
        </div>

        <div class="hb-detail-grid">
            <div class="hb-detail-row">
                <span class="hb-detail-label">Первая сторона</span>
                <span class="hb-detail-value"
                      th:text="${pipeAdapter.firstSideType + ' ' + pipeAdapter.firstSideDiameter}">—</span>
            </div>
            <div class="hb-detail-row">
                <span class="hb-detail-label">Вторая сторона</span>
                <span class="hb-detail-value"
                      th:text="${pipeAdapter.secondSideType + ' ' + pipeAdapter.secondSideDiameter}">—</span>
            </div>
            <div class="hb-detail-row">
                <span class="hb-detail-label">Длина (мм)</span>
                <span class="hb-detail-value" th:text="${pipeAdapter.lengthMm}">—</span>
            </div>
            <div class="hb-detail-row">
                <span class="hb-detail-label">Вес (кг)</span>
                <span class="hb-detail-value" th:text="${pipeAdapter.weightKg}">—</span>
            </div>
            <div class="hb-detail-row">
                <span class="hb-detail-label">Наружный Ø (мм)</span>
                <span class="hb-detail-value" th:text="${pipeAdapter.outerDiameterMm}">—</span>
            </div>
            <div class="hb-detail-row">
                <span class="hb-detail-label">Внутренний Ø (мм)</span>
                <span class="hb-detail-value" th:text="${pipeAdapter.innerDiameterMm}">—</span>
            </div>
            <div class="hb-detail-row">
                <span class="hb-detail-label">Цена изготовления (руб)</span>
                <span class="hb-detail-value accent" th:text="${pipeAdapter.manufacturingCost}">—</span>
            </div>
            <div class="hb-detail-row">
                <span class="hb-detail-label">Цена для работника (руб)</span>
                <span class="hb-detail-value accent" th:text="${pipeAdapter.priceForEmployee}">—</span>
            </div>
            <div class="hb-detail-row"
                 th:if="${pipeAdapter.standart != null and !pipeAdapter.standart.isEmpty()}">
                <span class="hb-detail-label">ГОСТ</span>
                <span class="hb-detail-value" th:text="${pipeAdapter.standart}">—</span>
            </div>
            <div class="hb-detail-row hb-detail-full"
                 th:if="${pipeAdapter.description != null and !pipeAdapter.description.isEmpty()}">
                <span class="hb-detail-label">Описание</span>
                <span class="hb-detail-value" th:text="${pipeAdapter.description}">—</span>
            </div>
        </div>

    </div>

    <!-- ─── Чертёж ─── -->
    <div class="hb-drawing-panel"
         id="drawingPanel"
         th:if="${pipeAdapter.drawingPath != null and !pipeAdapter.drawingPath.isEmpty()}">

        <div class="hb-drawing-panel-head">
            <div class="hb-drawing-panel-title">
                <i class="bi bi-rulers"></i>
                <span>Чертёж</span>
                <span class="hb-drawing-filename"
                      th:text="${pipeAdapter.drawingOriginalName}">file.pdf</span>
            </div>
            <div class="hb-drawing-actions">
                <a th:href="@{/pipe-adapters/{id}/drawing/download(id=${pipeAdapter.id})}"
                   class="hb-icon-btn"
                   data-turbo="false"
                   title="Скачать">
                    <i class="bi bi-download"></i>
                </a>

                <form th:action="@{/pipe-adapters/{id}/drawing/delete(id=${pipeAdapter.id})}"
                      method="post"
                      onsubmit="return confirm('Удалить чертёж?');"
                      style="display:inline">
                    <button type="submit"
                            class="hb-icon-btn hb-icon-btn-danger"
                            title="Удалить">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </div>
        </div>

        <div class="hb-drawing-viewport">

            <div th:if="${#strings.endsWith(pipeAdapter.drawingPath, '.pdf')}"
                 class="hb-drawing-pdf-wrap">
                <iframe th:src="@{${pipeAdapter.drawingPath}}"
                        class="hb-drawing-pdf"
                        title="Чертёж PDF"></iframe>
            </div>

            <img th:unless="${#strings.endsWith(pipeAdapter.drawingPath, '.pdf')}"
                 th:src="@{${pipeAdapter.drawingPath}}"
                 class="hb-drawing-image"
                 th:attr="data-drawing-src=@{${pipeAdapter.drawingPath}}"
                 alt="Чертёж переводника"/>
        </div>
    </div>

</div>

</body>
</html>
