<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>


<!--/*@thymesVar id="pipeAdapter"
    type="ProjectForJob.example.Job.entityJob.Handbook.PipeAdapterEntity"*/-->


<div th:fragment="content" class="handbook-content">

    <header class="handbook-header">
        <div class="handbook-title-wrap">
            <a th:href="@{/pipe-adapters}" data-turbo-frame="app" class="hb-icon-btn hb-back" title="Назад">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h1 class="handbook-title"
                th:text="${pipeAdapter.id == null} ? 'Новый переводник' : 'Редактирование переводника'">
                Новый переводник
            </h1>
        </div>
    </header>

    <form th:action="@{/pipe-adapters/save}" th:object="${pipeAdapter}" method="post"
          class="handbook-form">

        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" id="imageBase64" name="imageBase64"/>

        <div class="hb-grid">

            <div class="hb-field">
                <label for="firstSideType">Тип первой стороны <span class="req">*</span></label>
                <input type="text" id="firstSideType" th:field="*{firstSideType}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('firstSideType')}"
                      th:errors="*{firstSideType}"></span>
            </div>

            <div class="hb-field">
                <label for="firstSideDiameter">Диаметр первой стороны <span class="req">*</span></label>
                <input type="text" id="firstSideDiameter" th:field="*{firstSideDiameter}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('firstSideDiameter')}"
                      th:errors="*{firstSideDiameter}"></span>
            </div>

            <div class="hb-field">
                <label for="secondSideType">Тип второй стороны <span class="req">*</span></label>
                <input type="text" id="secondSideType" th:field="*{secondSideType}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('secondSideType')}"
                      th:errors="*{secondSideType}"></span>
            </div>

            <div class="hb-field">
                <label for="secondSideDiameter">Диаметр второй стороны <span class="req">*</span></label>
                <input type="text" id="secondSideDiameter" th:field="*{secondSideDiameter}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('secondSideDiameter')}"
                      th:errors="*{secondSideDiameter}"></span>
            </div>

            <div class="hb-field">
                <label for="lengthMm">Длина (мм) <span class="req">*</span></label>
                <input type="number" step="0.1" id="lengthMm" th:field="*{lengthMm}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('lengthMm')}" th:errors="*{lengthMm}"></span>
            </div>

            <div class="hb-field">
                <label for="weightKg">Вес (кг) <span class="req">*</span></label>
                <input type="number" step="0.01" id="weightKg" th:field="*{weightKg}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}"></span>
            </div>

            <div class="hb-field">
                <label for="outerDiameterMm">Наружный диаметр (мм) <span class="req">*</span></label>
                <input type="number" step="0.1" id="outerDiameterMm" th:field="*{outerDiameterMm}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('outerDiameterMm')}"
                      th:errors="*{outerDiameterMm}"></span>
            </div>

            <div class="hb-field">
                <label for="innerDiameterMm">Внутренний диаметр (мм) <span class="req">*</span></label>
                <input type="number" step="0.1" id="innerDiameterMm" th:field="*{innerDiameterMm}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('innerDiameterMm')}"
                      th:errors="*{innerDiameterMm}"></span>
            </div>

            <div class="hb-field">
                <label for="manufacturingCost">Цена изготовления (руб) <span class="req">*</span></label>
                <input type="number" step="0.01" id="manufacturingCost" th:field="*{manufacturingCost}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('manufacturingCost')}"
                      th:errors="*{manufacturingCost}"></span>
            </div>

            <div class="hb-field">
                <label for="priceForEmployee">Цена для работника (руб) <span class="req">*</span></label>
                <input type="number" step="0.01" id="priceForEmployee" th:field="*{priceForEmployee}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('priceForEmployee')}"
                      th:errors="*{priceForEmployee}"></span>
            </div>

            <div class="hb-field hb-field-full">
                <label for="standart">ГОСТ</label>
                <input type="text" id="standart" th:field="*{standart}" placeholder="Необязательно"/>
            </div>

            <div class="hb-field hb-field-full">
                <label for="description">Описание</label>
                <textarea id="description" th:field="*{description}" rows="3" placeholder="Необязательно"></textarea>
            </div>

            <div class="hb-field hb-field-full">
                <label for="imageFileInput">Фото переводника (jpg, png, gif, до 5 МБ)</label>
                <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/gif"/>

                <div th:if="${pipeAdapter.imagePath != null and !pipeAdapter.imagePath.isEmpty()}"
                     class="hb-image-preview">
                    <img th:src="@{${pipeAdapter.imagePath}}" alt="Текущее фото"/>
                    <p>Текущее фото. Загрузите новое, чтобы заменить.</p>
                </div>
            </div>

        </div>

        <div class="handbook-form-actions">
            <button type="submit" class="btn-glass btn-glass-primary">
                <i class="bi bi-check-lg"></i> Сохранить
            </button>
            <a th:href="@{/pipe-adapters}" data-turbo-frame="app" class="btn-glass btn-glass-ghost">
                Отмена
            </a>
        </div>

    </form>

</div>

</body>
</html>
