<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="handbook-content">

    <header class="handbook-header">
        <div class="handbook-title-wrap">
            <a th:href="@{/couplings}" data-turbo-frame="app" class="hb-icon-btn hb-back" title="Назад">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h1 class="handbook-title"
                th:text="${coupling.id == null} ? 'Новая муфта' : 'Редактирование муфты'">
                Новая муфта
            </h1>
        </div>
    </header>

    <form th:action="@{/couplings/save}" th:object="${coupling}" method="post"
          class="handbook-form">

        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" id="imageBase64" name="imageBase64"/>

        <div class="hb-grid">

            <div class="hb-field">
                <label for="type">Тип муфты <span class="req">*</span></label>
                <input type="text" id="type" th:field="*{type}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
            </div>

            <div class="hb-field">
                <label for="conditionalDiameter">Условный диаметр <span class="req">*</span></label>
                <input type="text" id="conditionalDiameter" th:field="*{conditionalDiameter}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('conditionalDiameter')}" th:errors="*{conditionalDiameter}"></span>
            </div>

            <div class="hb-field">
                <label for="lengthMm">Длина (мм) <span class="req">*</span></label>
                <input type="number" step="0.1" id="lengthMm" th:field="*{lengthMm}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('lengthMm')}" th:errors="*{lengthMm}"></span>
            </div>

            <div class="hb-field">
                <label for="weightKg">Вес (кг) <span class="req">*</span></label>
                <input type="number" step="0.01" id="weightKg" th:field="*{weightKg}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}"></span>
            </div>

            <div class="hb-field">
                <label for="outerDiameterMm">Наружный диаметр (мм) <span class="req">*</span></label>
                <input type="number" step="0.1" id="outerDiameterMm" th:field="*{outerDiameterMm}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('outerDiameterMm')}" th:errors="*{outerDiameterMm}"></span>
            </div>

            <div class="hb-field">
                <label for="innerDiameterMm">Внутренний диаметр (мм) <span class="req">*</span></label>
                <input type="number" step="0.1" id="innerDiameterMm" th:field="*{innerDiameterMm}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('innerDiameterMm')}" th:errors="*{innerDiameterMm}"></span>
            </div>

            <div class="hb-field">
                <label for="manufacturingCost">Цена изготовления (руб) <span class="req">*</span></label>
                <input type="number" step="0.01" id="manufacturingCost" th:field="*{manufacturingCost}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('manufacturingCost')}" th:errors="*{manufacturingCost}"></span>
            </div>

            <div class="hb-field">
                <label for="priceForEmployee">Цена для работника (руб) <span class="req">*</span></label>
                <input type="number" step="0.01" id="priceForEmployee" th:field="*{priceForEmployee}" required/>
                <span class="hb-error" th:if="${#fields.hasErrors('priceForEmployee')}" th:errors="*{priceForEmployee}"></span>
            </div>

            <div class="hb-field hb-field-full">
                <label for="standart">ГОСТ</label>
                <input type="text" id="standart" th:field="*{standart}" placeholder="Необязательно"/>
            </div>

            <div class="hb-field hb-field-full">
                <label for="description">Описание</label>
                <textarea id="description" th:field="*{description}" rows="3" placeholder="Необязательно"></textarea>
            </div>

            <!-- ── ФОТО ── -->
            <div class="hb-field hb-field-full">
                <label for="imageFileInput">Фото муфты (jpg, png, gif, до 5 МБ)</label>
                <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/gif"/>

                <div th:if="${coupling.imagePath != null and !coupling.imagePath.isEmpty()}"
                     class="hb-image-preview">
                    <img th:src="@{${coupling.imagePath}}" alt="Текущее фото"/>
                    <p>Текущее фото. Загрузите новое, чтобы заменить.</p>
                </div>
            </div>

            <!-- ── ЧЕРТЁЖ ── -->
            <div class="hb-field hb-field-full">
                <label for="drawingFileInput">Чертёж (PDF, JPG, PNG, до 10 МБ)</label>
                <input type="file" id="drawingFileInput"
                       accept="application/pdf,image/jpeg,image/png"/>
                <input type="hidden" id="drawingBase64" name="drawingBase64"/>
                <input type="hidden" id="drawingOriginalName" name="drawingOriginalName"/>

                <div th:if="${coupling.drawingPath != null and !coupling.drawingPath.isEmpty()}"
                     class="hb-drawing-preview">

                    <div th:if="${#strings.endsWith(coupling.drawingPath, '.pdf')}"
                         class="hb-drawing-preview-icon">
                        <i class="bi bi-filetype-pdf"></i>
                        <span th:text="${coupling.drawingOriginalName}">чертёж.pdf</span>
                    </div>

                    <img th:unless="${#strings.endsWith(coupling.drawingPath, '.pdf')}"
                         th:src="@{${coupling.drawingPath}}"
                         alt="Чертёж"/>

                    <p>Текущий чертёж. Загрузите новый, чтобы заменить.</p>
                </div>
            </div>

        </div>

        <div class="handbook-form-actions">
            <button type="submit" class="btn-glass btn-glass-primary">
                <i class="bi bi-check-lg"></i> Сохранить
            </button>
            <a th:href="@{/couplings}" data-turbo-frame="app" class="btn-glass btn-glass-ghost">
                Отмена
            </a>
        </div>

    </form>

</div>

</body>
</html>
