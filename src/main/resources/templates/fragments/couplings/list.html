<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="handbook-content">

  <!-- Заголовок + действия -->
  <header class="handbook-header">
    <div class="handbook-title-wrap">
      <h1 class="handbook-title">Справочник муфт</h1>
        <span class="handbook-count"
              th:text="${totalCouplings != null ? totalCouplings : 0} + ' шт.'">
    0 шт.
</span>
    </div>
    <a th:href="@{/couplings/new}" data-turbo-frame="app" class="btn-glass btn-glass-primary">
      <i class="bi bi-plus-lg"></i> Добавить муфту
    </a>
  </header>

  <!-- Уведомления -->
  <div th:if="${message}" th:class="'handbook-alert handbook-alert-' + ${messageType}">
    <i class="bi bi-info-circle"></i>
    <span th:text="${message}">—</span>
  </div>

  <!-- Пустой список -->
  <div th:if="${groupedCouplings == null or groupedCouplings.isEmpty()}" class="journal-empty">
    Список муфт пуст
  </div>

  <!-- Аккордеон по типам -->
  <div class="hb-accordion" th:unless="${groupedCouplings == null or groupedCouplings.isEmpty()}">
    <div th:each="entry, iter : ${groupedCouplings}" class="hb-accordion-item">

      <button type="button" class="hb-accordion-toggle"
              th:classappend="${iter.index == 0} ? 'open' : ''"
              th:attr="data-target='hb-body-' + ${iter.index}">
        <i class="bi bi-chevron-right hb-chev"></i>
        <span class="hb-accordion-name" th:text="${entry.key}">НКТ</span>
        <span class="hb-accordion-count" th:text="${#lists.size(entry.value)} + ' поз.'">3 поз.</span>
      </button>

      <div class="hb-accordion-body" th:classappend="${iter.index == 0} ? 'open' : ''"
           th:id="'hb-body-' + ${iter.index}">

        <table class="journal-table hb-table">
          <thead>
          <tr>
            <th>Обозначение</th>
            <th>Длина (мм)</th>
            <th>Вес (кг)</th>
            <th>Наруж. Ø (мм)</th>
            <th>Внутр. Ø (мм)</th>
            <th>Цена (руб)</th>
            <th>Для работника (руб)</th>
            <th></th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="coupling : ${entry.value}">
            <td>
                        <span class="product-name-wrapper">
                            <span class="product-tooltip"
                                  th:attr="data-id=${coupling.id},
                                           data-name=${coupling.name},
                                           data-type=${coupling.type},
                                           data-diameter=${coupling.conditionalDiameter},
                                           data-length=${coupling.lengthMm != null ? coupling.lengthMm : ''},
                                           data-weight=${coupling.weightKg != null ? coupling.weightKg : ''},
                                           data-outer-diameter=${coupling.outerDiameterMm != null ? coupling.outerDiameterMm : ''},
                                           data-inner-diameter=${coupling.innerDiameterMm != null ? coupling.innerDiameterMm : ''},
                                           data-cost=${coupling.manufacturingCost != null ? coupling.manufacturingCost : ''},
                                           data-price=${coupling.priceForEmployee != null ? coupling.priceForEmployee : ''},
                                           data-description=${coupling.description != null ? coupling.description : ''},
                                           data-image=${coupling.imagePath != null ? coupling.imagePath : ''}"
                                  th:text="${coupling.name}">НКТ 73</span>
                        </span>
            </td>
            <td th:text="${coupling.lengthMm}">—</td>
            <td th:text="${coupling.weightKg}">—</td>
            <td th:text="${coupling.outerDiameterMm}">—</td>
            <td th:text="${coupling.innerDiameterMm}">—</td>
            <td th:text="${coupling.manufacturingCost}">—</td>
            <td th:text="${coupling.priceForEmployee}">—</td>
            <td class="hb-actions">
              <a th:href="@{/couplings/{id}(id=${coupling.id})}"
                 data-turbo-frame="app"
                 class="hb-icon-btn" title="Открыть">
                <i class="bi bi-eye"></i>
              </a>
              <a th:href="@{/couplings/edit/{id}(id=${coupling.id})}"
                 data-turbo-frame="app"
                 class="hb-icon-btn" title="Редактировать">
                <i class="bi bi-pencil"></i>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

</div>

</body>
</html>
