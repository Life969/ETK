<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- head не используется при вставке фрагмента -->
</head>
<body>
<div th:fragment="navbar" class="mb-4">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1e2b38;">
        <div class="container-fluid">
            <!-- Логотип ведёт на dashboard -->
            <a class="navbar-brand" href="/home">
                <i class="bi bi-cloud-lightning-fill"></i>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <!-- Основное меню -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- Главная теперь ведёт на /home -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${currentUri == '/' or currentUri == '/home'} ? 'active' : ''"
                           href="/home">Главная</a>
                    </li>
                    <li class="nav-item dropdown"
                        th:classappend="${currentUri.startsWith('/couplings') or currentUri.startsWith('/employees') or currentUri.startsWith('/machines')} ? 'active' : ''">
                        <a class="nav-link dropdown-toggle" href="#" id="referencesDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-database"></i> Справочники
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="referencesDropdown">
                            <li><a class="dropdown-item" href="/couplings">Муфты</a></li>
                            <li><a class="dropdown-item" href="/pipe-adapters">Переводники</a></li>
                            <li><a class="dropdown-item" href="/employees">Сотрудники</a></li>
                            <li><a class="dropdown-item" href="/machines">Станки</a></li>
                            <li><a class="dropdown-item" href="/additionalWork">Доп.Работы</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown"
                        th:classappend="${currentUri != null and currentUri.startsWith('/orders')} ? 'active' : ''">
                        <a class="nav-link dropdown-toggle" href="#" id="ordersDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-cart"></i> Заказы
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="ordersDropdown">
                            <li><a class="dropdown-item" href="/orders/waiting">В ожидании</a></li>
                            <li><a class="dropdown-item" href="/orders/production">В производстве</a></li>
                            <li><a class="dropdown-item" href="/orders/completed">Выполненные</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${currentUri.startsWith('/production-records')} ? 'active' : ''"
                           href="/production-records">Журнал Производства</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="reportsDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-file-text"></i> Отчёты
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="reportsDropdown">
                            <li><a class="dropdown-item" href="/reports/employee">По сотруднику</a></li>
                            <li><a class="dropdown-item" href="/reports/machine">По станку</a></li>
                        </ul>
                    </li>
                </ul>

                <!-- Блок аутентификации: выпадашка с именем и кнопкой Выйти -->
                <ul class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> <span sec:authentication="name"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <!-- Форма для безопасного логаута (POST + CSRF) -->
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                                    <button type="submit" class="dropdown-item">
                                        <i class="bi bi-box-arrow-right"></i> Выйти
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
