<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">

            <!-- Логотип — осенний лист (наш SVG-символ) -->
            <a class="navbar-brand" href="/home" data-turbo-frame="app" aria-label="Главная">
                <svg class="brand-leaf" viewBox="0 0 40 60">
                    <use href="#leaf-icon"/>
                </svg>
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" data-turbo-frame="app" href="/home">Главная</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-database"></i> Справочники
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/couplings">Муфты</a></li>
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/pipe-adapters">Переводники</a></li>
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/employees">Сотрудники</a></li>
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/machines">Станки</a></li>
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/additionalWork">Доп. работы</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-cart"></i> Заказы
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/orders/waiting">В ожидании</a></li>
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/orders/production">В производстве</a></li>
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/orders/completed">Выполненные</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" data-turbo-frame="app" href="/production-records">Журнал производства</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-file-text"></i> Отчёты
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/reports/employee">По сотруднику</a></li>
                            <li><a class="dropdown-item" data-turbo-frame="app" href="/reports/machine">По станку</a></li>
                        </ul>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> <span sec:authentication="name"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0" data-turbo="false">
                                    <button type="submit" class="dropdown-item" data-turbo="false">
                                        <i class="bi bi-box-arrow-right"></i> Выйти
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

</body>
</html>
