<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="content" class="handbook-content orders-content">

    <header class="handbook-header">
        <div class="handbook-title-wrap">
            <h1 class="handbook-title">Выполненные заказы</h1>
            <span class="handbook-count" th:text="${ordersPage.totalElements + ' шт.'}">—</span>
        </div>
        <div class="orders-nav-btns">
            <a class="btn-glass btn-glass-primary" data-turbo-frame="app" th:href="@{/orders/create}">
                <i class="bi bi-plus-circle"></i> Создать заказ
            </a>
            <a class="btn-glass btn-glass-info" data-turbo-frame="app" th:href="@{/orders/waiting}">
                <i class="bi bi-hourglass-split"></i> К ожидающим
            </a>
            <a class="btn-glass btn-glass-primary" data-turbo-frame="app" th:href="@{/orders/production}">
                <i class="bi bi-wrench"></i> В производство
            </a>
        </div>
    </header>

    <form method="get" th:action="@{/orders/completed}" class="hb-search" data-turbo-frame="app">
        <input type="text" name="search" th:value="${search}"
               placeholder="Поиск по компании или продукции...">
        <button type="submit" class="hb-search-btn"><i class="bi bi-search"></i></button>
    </form>

    <div th:if="${#lists.isEmpty(ordersPage.content)}" class="journal-empty">
        <i class="bi bi-inbox"></i> Нет завершённых заказов
    </div>

    <div class="orders-grid" th:unless="${#lists.isEmpty(ordersPage.content)}">
        <div th:each="order : ${ordersPage.content}" class="order-card">

            <div class="order-card-head">
                <div class="order-card-head-left">
                    <a class="order-company"
                       data-turbo-frame="app"
                       th:href="@{/orders/{id}(id=${order.id})}"
                       th:text="${order.companyName}">Компания</a>
                    <span class="product-type-badge"
                          th:with="pt=${order.productType}"
                          th:classappend="${pt == 'COUPLING' ? 'product-type-badge--coupling' : (pt == 'ADAPTER' ? 'product-type-badge--adapter' : (pt == 'NIPPLE' ? 'product-type-badge--nipple' : 'product-type-badge--pipe'))}"
                          th:text="${pt == 'NIPPLE' and order.pieceLengthMm != null
                          ? 'Патрубок L-' + #numbers.formatInteger(order.pieceLengthMm, 0)
                          : (pt == 'COUPLING' ? 'Муфта' : (pt == 'ADAPTER' ? 'Переводник' : (pt == 'PIPE' ? 'Труба' : (pt == 'NIPPLE' ? 'Патрубок' : '—'))))}">—
                    </span>
                </div>
            </div>

            <div class="order-product">
                <!-- Иконка: 4 цвета -->
                <span class="product-icon-tile product-icon-tile--sm"
                      th:with="pt=${order.productType}"
                      th:classappend="${pt == 'COUPLING' ? 'product-icon-tile--coupling' : (pt == 'ADAPTER' ? 'product-icon-tile--adapter' : (pt == 'NIPPLE' ? 'product-icon-tile--nipple' : 'product-icon-tile--pipe'))}">
                    <img class="product-icon-img"
                         th:src="${order.productType == 'COUPLING'} ? @{/images/product-coupling.png} : (${order.productType == 'ADAPTER'} ? @{/images/product-adapter.png} : @{/images/product-pipe.png})"
                         alt="" aria-hidden="true">
                </span>

                <!-- Муфта — тултип -->
                <span th:if="${order.productType == 'COUPLING'}"
                      class="product-name-wrapper">
                    <span class="product-tooltip"
                          th:attr="data-id=${order.productId},
                                   data-name=${order.productName},
                                   data-type=${order.productVariantType},
                                   data-diameter=${order.productVariantDiameter},
                                   data-length=${order.productLengthMm != null ? order.productLengthMm : ''},
                                   data-weight=${order.productWeightKg != null ? order.productWeightKg : ''},
                                   data-outer-diameter=${order.productOuterDiameterMm != null ? order.productOuterDiameterMm : ''},
                                   data-inner-diameter=${order.productInnerDiameterMm != null ? order.productInnerDiameterMm : ''},
                                   data-cost=${order.productManufacturingCost != null ? order.productManufacturingCost : ''},
                                   data-price=${order.productPriceForEmployee != null ? order.productPriceForEmployee : ''},
                                   data-description=${order.productDescription != null ? order.productDescription : ''},
                                   data-image=${order.productImagePath != null ? order.productImagePath : ''}"
                          th:text="${order.productName}">—</span>
                </span>

                <!-- Переводник — тултип -->
                <span th:if="${order.productType == 'ADAPTER'}"
                      class="product-name-wrapper">
                    <span class="product-tooltip"
                          th:attr="data-id=${order.productId},
                                   data-name=${order.productName},
                                   data-first-type=${order.productAdapterFirstSideType},
                                   data-first-diameter=${order.productAdapterFirstSideDiameter},
                                   data-second-type=${order.productAdapterSecondSideType},
                                   data-second-diameter=${order.productAdapterSecondSideDiameter},
                                   data-length=${order.productLengthMm != null ? order.productLengthMm : ''},
                                   data-weight=${order.productWeightKg != null ? order.productWeightKg : ''},
                                   data-outer-diameter=${order.productOuterDiameterMm != null ? order.productOuterDiameterMm : ''},
                                   data-inner-diameter=${order.productInnerDiameterMm != null ? order.productInnerDiameterMm : ''},
                                   data-cost=${order.productManufacturingCost != null ? order.productManufacturingCost : ''},
                                   data-price=${order.productPriceForEmployee != null ? order.productPriceForEmployee : ''},
                                   data-description=${order.productDescription != null ? order.productDescription : ''},
                                   data-image=${order.productImagePath != null ? order.productImagePath : ''}"
                          th:text="${order.productName}">—</span>
                </span>

                <!-- Труба / патрубок — тултип -->
                <span th:if="${order.productType == 'PIPE' or order.productType == 'NIPPLE'}"
                      class="product-name-wrapper">
                    <span class="product-tooltip"
                          th:attr="data-pipe-kind=${order.productType},
                                   data-name=${order.externalThreadName},
                                   data-conditional-diameter=${order.externalThreadDiameter != null ? order.externalThreadDiameter : ''},
                                   data-piece-length=${order.pieceLengthMm != null ? order.pieceLengthMm : ''},
                                   data-wall-thickness=${order.wallThicknessMm != null ? order.wallThicknessMm : ''},
                                   data-total-length=${order.orderTotalLengthMeters != null ? order.orderTotalLengthMeters : ''},
                                   data-total-weight=${order.orderTotalWeightKg != null ? order.orderTotalWeightKg : ''},
                                   data-cost=${order.externalThreadManufacturingCost != null ? order.externalThreadManufacturingCost : ''},
                                   data-price=${order.externalThreadPriceForEmployee != null ? order.externalThreadPriceForEmployee : ''}"
                          th:text="${order.externalThreadName}">—</span>
                </span>
            </div>

            <div class="order-meta">
                <div class="order-meta-row">
                    <span class="order-meta-label">Кол-во</span>
                    <span class="order-meta-value" th:text="${order.quantity} + ' шт.'">0 шт.</span>
                </div>
                <div class="order-meta-row" th:if="${order.strengthGroupCode != null}">
                    <span class="order-meta-label">Сталь</span>
                    <span class="order-meta-value">
                        <span th:text="${order.strengthGroupCode}">Е</span>
                        <span th:if="${order.steelGradeName != null}"
                              style="opacity:0.7;"
                              th:text="' / ' + ${order.steelGradeName}"> / 30ХГСА</span>
                    </span>
                </div>
                <div class="order-meta-row">
                    <span class="order-meta-label">Стоимость</span>
                    <span class="order-meta-value accent"
                          th:text="${#numbers.formatDecimal(order.totalCost, 0, 'COMMA', 2, 'POINT')} + ' ₽'">—</span>
                </div>
                <div class="order-meta-row">
                    <span class="order-meta-label">Дедлайн</span>
                    <span class="order-meta-value"
                          th:text="${order.deadline != null ? #temporals.format(order.deadline, 'dd.MM.yyyy') : '—'}">—</span>
                </div>
                <div class="order-meta-row">
                    <span class="order-meta-label">Создан</span>
                    <span class="order-meta-value"
                          th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">—</span>
                </div>
            </div>

            <div class="order-actions">
                <form th:action="@{/orders/{id}/status(id=${order.id})}" method="post"
                      data-turbo-frame="app" class="d-inline">
                    <input type="hidden" name="newStatus" value="IN_PRODUCTION">
                    <input type="hidden" name="returnTo" value="/orders/completed">
                    <button type="submit" class="btn-mini btn-mini-warning"
                            data-transition-target="/orders/production">
                        <i class="bi bi-arrow-repeat"></i> Вернуть в производство
                    </button>
                </form>
                <a class="btn-mini btn-mini-info" data-turbo-frame="app"
                   th:href="@{/orders/{id}(id=${order.id})}">
                    <i class="bi bi-eye"></i> Открыть
                </a>
            </div>
        </div>
    </div>

    <nav class="hb-pagination" th:if="${ordersPage.totalPages > 1}">
        <a class="hb-page-btn"
           th:classappend="${!ordersPage.hasPrevious()} ? 'disabled'"
           data-turbo-frame="app"
           th:href="@{/orders/completed(page=${ordersPage.number - 1}, size=${ordersPage.size}, search=${search})}">
            <i class="bi bi-chevron-left"></i> Назад
        </a>
        <span class="hb-page-info"
              th:text="${ordersPage.number + 1} + ' / ' + ${ordersPage.totalPages}">1 / 1</span>
        <a class="hb-page-btn"
           th:classappend="${!ordersPage.hasNext()} ? 'disabled'"
           data-turbo-frame="app"
           th:href="@{/orders/completed(page=${ordersPage.number + 1}, size=${ordersPage.size}, search=${search})}">
            Вперёд <i class="bi bi-chevron-right"></i>
        </a>
    </nav>
</div>

</body>
</html>
