services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: jobdb
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: 'zpletk'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobuser -d jobdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend


  app:
    build: .
    container_name: spring_app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    command: >
      sh -c "java -Djava.security.egd=file:/dev/./urandom 
      -Dspring.datasource.hikari.connection-timeout=60000 
      -jar app.jar"





networks:
  backend:
    name: job_backend_network
    driver: bridge

volumes:
  postgres_data: